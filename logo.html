<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xuanji Logo Design</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0A1628;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }
    .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #0066CC 0%, #FF6B35 100%);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: white;
      box-shadow: 0 8px 30px rgba(0, 102, 204, 0.4);
    }
    .logo-text {
      display: flex;
      flex-direction: column;
    }
    .logo-name {
      font-size: 28px;
      font-weight: 700;
      color: #0066CC;
    }
    .logo-name span {
      color: #FF6B35;
    }
    .logo-subtitle {
      font-size: 14px;
      color: #8892A6;
      margin-top: 5px;
    }
    .preview-section {
      background: #112240;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 20px;
    }
    .preview-header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      background: rgba(10, 22, 40, 0.8);
      border-radius: 10px;
    }
    .preview-logo {
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg, #0066CC 0%, #FF6B35 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: white;
    }
    .preview-title {
      font-size: 18px;
      font-weight: 600;
    }
    .preview-sub {
      font-size: 12px;
      color: #8892A6;
    }
    .colors {
      display: flex;
      gap: 20px;
      margin-top: 30px;
    }
    .color-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .color-box {
      width: 50px;
      height: 50px;
      border-radius: 10px;
    }
    .color-code {
      font-size: 12px;
      color: #8892A6;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-icon">XJ</div>
    <div class="logo-text">
      <div class="logo-name">Xuan<span>Ji</span></div>
      <div class="logo-subtitle">Hangzhou Xuanji Technology Co.,Ltd</div>
    </div>
  </div>

  <div class="preview-section">
    <div class="preview-header">
      <div class="preview-logo">XJ</div>
      <div>
        <div class="preview-title">杭州铉戟科技有限公司</div>
        <div class="preview-sub">Hangzhou Xuanji Technology Co.,Ltd</div>
      </div>
    </div>
  </div>

  <div class="colors">
    <div class="color-item">
      <div class="color-box" style="background: #0066CC;"></div>
      <div class="color-code">#0066CC</div>
    </div>
    <div class="color-item">
      <div class="color-box" style="background: #FF6B35;"></div>
      <div class="color-code">#FF6B35</div>
    </div>
    <div class="color-item">
      <div class="color-box" style="background: #0A1628;"></div>
      <div class="color-code">#0A1628</div>
    </div>
    <div class="color-item">
      <div class="color-box" style="background: #112240;"></div>
      <div class="color-code">#112240</div>
    </div>
  </div>
</body>
</html>
